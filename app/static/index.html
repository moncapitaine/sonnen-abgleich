<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sonnen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sonnen-Abgleich</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="sun" aria-hidden="true"></span>
    <div>
      <h1>Sonnen-Abgleich</h1>
      <p id="site-name" class="muted"></p>
    </div>
  </div>
  <nav id="tabs" class="tabs" aria-label="Bereiche">
    <button data-tab="overview" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg><span>Übersicht</span></button>
    <button data-tab="analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Analyse</span></button>
    <button data-tab="meter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-5"/><circle cx="12" cy="13" r="1.3"/></svg><span>Zählerabgleich</span></button>
    <button data-tab="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>Daten</span></button>
  </nav>
</header>

<div id="filters" class="filters" hidden>
  <div class="seg" id="presets" role="group" aria-label="Zeitraum"></div>
  <label>von <input type="date" id="f-from"></label>
  <label>bis <input type="date" id="f-to"></label>
  <div class="seg" id="gran" role="group" aria-label="Auflösung" hidden>
    <button data-g="day">Tag</button><button data-g="week">Woche</button><button data-g="month" class="on">Monat</button>
  </div>
</div>

<main id="view"></main>

<dialog id="dlg"><form method="dialog" id="dlg-body"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
